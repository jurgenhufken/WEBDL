<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>WEBDL — Jobs · Errors · Stopgezet</title>
<style>
  :root {
    --bg: #1a1a2e; --bg2: #25253d; --fg: #e8e8f0; --muted: #8a8aa3;
    --accent: #ec4899; --warn: #f59e0b; --danger: #ef4444; --ok: #10b981;
    --border: #3a3a55;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif;
         background: var(--bg); color: var(--fg); font-size: 14px; }
  header { padding: 14px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
           display: flex; gap: 12px; align-items: center; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header a { color: var(--muted); text-decoration: none; margin-left: auto; }
  header a:hover { color: var(--fg); }
  nav.tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--bg2);
             border-bottom: 1px solid var(--border); }
  nav.tabs button { background: transparent; border: none; color: var(--muted);
                    padding: 12px 18px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
  nav.tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
  nav.tabs button:hover { color: var(--fg); }
  nav.tabs .count { color: var(--muted); margin-left: 6px; font-size: 12px; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .clusters { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .cluster { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
             padding: 14px; cursor: pointer; transition: border-color 0.2s; }
  .cluster:hover { border-color: var(--accent); }
  .cluster h3 { margin: 0 0 6px; font-size: 15px; color: var(--fg); }
  .cluster .total { font-size: 28px; font-weight: 700; color: var(--accent); }
  .cluster .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .cluster .spike { color: var(--warn); margin-left: 8px; }
  .cluster .recent { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .items { margin-top: 20px; }
  .items table { width: 100%; border-collapse: collapse; }
  .items th, .items td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
                         font-size: 13px; vertical-align: top; }
  .items th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .items td.err { color: var(--muted); font-family: ui-monospace, monospace; font-size: 11px;
                  max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .items td.title { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .badge.platform { background: var(--bg); color: var(--muted); }
  #status { color: var(--muted); margin-left: auto; font-size: 12px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  button.back { background: transparent; border: 1px solid var(--border); color: var(--fg);
                padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 12px; }
  button.back:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>⚙️ Jobs — Errors · Stopgezet</h1>
  <span id="status"></span>
  <a href="/">← Gallery</a>
</header>
<nav class="tabs">
  <button data-tab="errors" class="active">⚠️ Fouten <span class="count" id="cnt-errors">…</span></button>
  <button data-tab="cancelled">⏸ Stopgezet <span class="count" id="cnt-cancelled">…</span></button>
  <button data-tab="superseded">🗑 Vervangen <span class="count" id="cnt-superseded">…</span></button>
</nav>
<main>
  <div id="panel-errors">
    <div id="clusters-view"><div class="clusters" id="clusters"></div></div>
    <div id="items-view" style="display: none;">
      <button class="back" onclick="showClusters()">← Terug naar clusters</button>
      <h2 id="items-title"></h2>
      <div class="items"><table id="items-table"></table></div>
    </div>
  </div>
  <div id="panel-cancelled" style="display: none;">
    <div class="items"><table id="cancelled-table"></table></div>
  </div>
  <div id="panel-superseded" style="display: none;">
    <div class="items"><table id="superseded-table"></table></div>
  </div>
</main>
<script>
const CLUSTER_LABELS = {
  hotlink_protected: { label: '🔒 Hotlink beschermd', desc: 'Imagetwist/vipr.im/imagebam: Referer mist' },
  captcha_required: { label: '🤖 Captcha vereist', desc: 'K2S vraagt menselijke verificatie' },
  k2s_auth_or_404: { label: '🔑 K2S auth / file weg', desc: 'Token afgewezen of file niet meer beschikbaar' },
  wrapper_unresolved: { label: '🔗 Wrapper niet opgelost', desc: 'Imagevenue/imagefap: yt-dlp kan URL niet aan' },
  archive_corrupt: { label: '📦 Archief corrupt', desc: 'RAR/ZIP CRC-fout of truncated' },
  source_or_file_gone: { label: '👻 Bron weg (404)', desc: 'Origineel verwijderd / niet meer beschikbaar' },
  network_flaky: { label: '🌐 Netwerk-flaky', desc: 'Connection reset / timeout' },
  no_audio_or_duration: { label: '🎵 Geen audio/duration', desc: 'ffprobe miste audio-track of duration' },
  type_mismatch: { label: '🚫 Type mismatch', desc: 'Verwachtte video, kreeg image (K2S poster-fallback)' },
  aborted_or_cancelled: { label: '🛑 Geannuleerd', desc: 'Door user of timeout afgebroken' },
  auth_problem: { label: '🔐 Auth-probleem', desc: 'Cookie/token verlopen of geweigerd' },
  uncategorized: { label: '❓ Niet geclassificeerd', desc: 'Pattern nog onbekend' },
};
let currentCluster = null;

function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }
function fmt(d) { return new Date(d).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }); }
function fmtBytes(b) {
  if (!b) return '';
  const u = ['B','KB','MB','GB']; let i=0, v=Number(b);
  while (v>=1024 && i<u.length-1) { v/=1024; i++; }
  return v.toFixed(1) + u[i];
}

async function loadClusters() {
  setStatus('Laden…');
  try {
    const r = await fetch('/api/jobs/errors/summary');
    const data = await r.json();
    const el = document.getElementById('clusters');
    el.innerHTML = '';
    let total = 0;
    for (const c of data.clusters || []) {
      total += Number(c.total);
      const info = CLUSTER_LABELS[c.cluster] || { label: c.cluster, desc: '' };
      const spike = c.last_hour > 20 ? `<span class="spike">🔥 +${c.last_hour}/u</span>` : '';
      const div = document.createElement('div');
      div.className = 'cluster';
      div.onclick = () => showCluster(c.cluster, info.label);
      div.innerHTML = `
        <h3>${info.label}${spike}</h3>
        <div class="total">${c.total}</div>
        <div class="meta">${info.desc}</div>
        <div class="recent">Laatste uur: ${c.last_hour} · 24u: ${c.last_day} · meest recent: ${fmt(c.most_recent)}</div>
      `;
      el.appendChild(div);
    }
    document.getElementById('cnt-errors').textContent = total.toLocaleString('nl-NL');
    setStatus(`${data.clusters.length} clusters · ${total.toLocaleString('nl-NL')} fout-items`);
  } catch (e) {
    setStatus('Fout: ' + e.message);
  }
}

async function showCluster(cluster, label) {
  currentCluster = cluster;
  document.getElementById('clusters-view').style.display = 'none';
  document.getElementById('items-view').style.display = 'block';
  document.getElementById('items-title').textContent = `${label} — sample (max 100)`;
  const r = await fetch('/api/jobs/errors/items?cluster=' + encodeURIComponent(cluster) + '&limit=100');
  const data = await r.json();
  const table = document.getElementById('items-table');
  if (!data.items?.length) {
    table.innerHTML = '<tbody><tr><td class="empty">Geen items</td></tr></tbody>';
    return;
  }
  table.innerHTML = `
    <thead><tr><th>id</th><th>platform</th><th>channel</th><th>title/filename</th><th>fout-tekst</th><th>updated</th></tr></thead>
    <tbody>${data.items.map(it => `
      <tr>
        <td>${it.id}</td>
        <td><span class="badge platform">${it.platform || ''}</span></td>
        <td class="title">${(it.channel||'').replace(/</g,'&lt;')}</td>
        <td class="title">${(it.title||it.filename||'').replace(/</g,'&lt;')}</td>
        <td class="err" title="${(it.error||'').replace(/"/g,'&quot;')}">${(it.error||'').replace(/</g,'&lt;')}</td>
        <td>${fmt(it.updated_at)}</td>
      </tr>`).join('')}
    </tbody>`;
}

function showClusters() {
  currentCluster = null;
  document.getElementById('clusters-view').style.display = 'block';
  document.getElementById('items-view').style.display = 'none';
}

async function loadCancelled() {
  const r = await fetch('/api/jobs/cancelled?limit=200');
  const data = await r.json();
  document.getElementById('cnt-cancelled').textContent = (data.items?.length || 0).toLocaleString('nl-NL');
  const table = document.getElementById('cancelled-table');
  if (!data.items?.length) { table.innerHTML = '<tbody><tr><td class="empty">Geen gestopt items</td></tr></tbody>'; return; }
  table.innerHTML = `
    <thead><tr><th>id</th><th>platform</th><th>channel</th><th>title</th><th>size</th><th>error</th><th>updated</th></tr></thead>
    <tbody>${data.items.map(it => `
      <tr>
        <td>${it.id}</td>
        <td><span class="badge platform">${it.platform || ''}</span></td>
        <td class="title">${(it.channel||'').replace(/</g,'&lt;')}</td>
        <td class="title">${(it.title||it.filename||'').replace(/</g,'&lt;')}</td>
        <td>${fmtBytes(it.filesize)}</td>
        <td class="err" title="${(it.error||'').replace(/"/g,'&quot;')}">${(it.error||'').replace(/</g,'&lt;')}</td>
        <td>${fmt(it.updated_at)}</td>
      </tr>`).join('')}
    </tbody>`;
}

async function loadSuperseded() {
  const r = await fetch('/api/jobs/superseded?limit=200');
  const data = await r.json();
  document.getElementById('cnt-superseded').textContent = (data.items?.length || 0).toLocaleString('nl-NL');
  const table = document.getElementById('superseded-table');
  if (!data.items?.length) { table.innerHTML = '<tbody><tr><td class="empty">Geen vervangen items</td></tr></tbody>'; return; }
  table.innerHTML = `
    <thead><tr><th>id</th><th>platform</th><th>channel</th><th>title</th><th>size</th><th>reden</th><th>updated</th></tr></thead>
    <tbody>${data.items.map(it => `
      <tr>
        <td>${it.id}</td>
        <td><span class="badge platform">${it.platform || ''}</span></td>
        <td class="title">${(it.channel||'').replace(/</g,'&lt;')}</td>
        <td class="title">${(it.title||it.filename||'').replace(/</g,'&lt;')}</td>
        <td>${fmtBytes(it.filesize)}</td>
        <td class="err" title="${(it.error||'').replace(/"/g,'&quot;')}">${(it.error||'').replace(/</g,'&lt;')}</td>
        <td>${fmt(it.updated_at)}</td>
      </tr>`).join('')}
    </tbody>`;
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('panel-errors').style.display = tab === 'errors' ? 'block' : 'none';
    document.getElementById('panel-cancelled').style.display = tab === 'cancelled' ? 'block' : 'none';
    document.getElementById('panel-superseded').style.display = tab === 'superseded' ? 'block' : 'none';
    if (tab === 'cancelled') loadCancelled();
    if (tab === 'superseded') loadSuperseded();
  };
});

loadClusters();
loadCancelled();
loadSuperseded();
</script>
</body>
</html>
